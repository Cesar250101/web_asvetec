<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <rect width="200" height="120" fill="#f7f8fa"/>
  <!-- 4x2 grid -->
  <rect x="8"   y="16" width="42" height="42" rx="3" fill="white" stroke="#e4e6eb" stroke-width="1"/>
  <rect x="56"  y="16" width="42" height="42" rx="3" fill="white" stroke="#e4e6eb" stroke-width="1"/>
  <rect x="104" y="16" width="42" height="42" rx="3" fill="white" stroke="#e4e6eb" stroke-width="1"/>
  <rect x="152" y="16" width="42" height="42" rx="3" fill="white" stroke="#e4e6eb" stroke-width="1"/>
  <rect x="8"   y="64" width="42" height="42" rx="3" fill="white" stroke="#e4e6eb" stroke-width="1"/>
  <rect x="56"  y="64" width="42" height="42" rx="3" fill="white" stroke="#e4e6eb" stroke-width="1"/>
  <rect x="104" y="64" width="42" height="42" rx="3" fill="white" stroke="#e4e6eb" stroke-width="1"/>
  <rect x="152" y="64" width="42" height="42" rx="3" fill="white" stroke="#e4e6eb" stroke-width="1"/>
  <!-- Icons inside cards -->
  <rect x="17"  y="25" width="12" height="12" rx="2" fill="rgba(15,159,230,0.2)"/>
  <rect x="65"  y="25" width="12" height="12" rx="2" fill="rgba(15,159,230,0.2)"/>
  <rect x="113" y="25" width="12" height="12" rx="2" fill="rgba(15,159,230,0.2)"/>
  <rect x="161" y="25" width="12" height="12" rx="2" fill="rgba(15,159,230,0.2)"/>
  <rect x="17"  y="73" width="12" height="12" rx="2" fill="rgba(15,159,230,0.2)"/>
  <rect x="65"  y="73" width="12" height="12" rx="2" fill="rgba(15,159,230,0.2)"/>
  <rect x="113" y="73" width="12" height="12" rx="2" fill="rgba(15,159,230,0.2)"/>
  <rect x="161" y="73" width="12" height="12" rx="2" fill="rgba(15,159,230,0.2)"/>
  <!-- Labels -->
  <rect x="12"  y="42" width="34" height="3" rx="1" fill="#2c2c61" opacity="0.6"/>
  <rect x="60"  y="42" width="34" height="3" rx="1" fill="#2c2c61" opacity="0.6"/>
  <rect x="108" y="42" width="34" height="3" rx="1" fill="#2c2c61" opacity="0.6"/>
  <rect x="156" y="42" width="34" height="3" rx="1" fill="#2c2c61" opacity="0.6"/>
  <rect x="12"  y="90" width="34" height="3" rx="1" fill="#2c2c61" opacity="0.6"/>
  <rect x="60"  y="90" width="34" height="3" rx="1" fill="#2c2c61" opacity="0.6"/>
  <rect x="108" y="90" width="34" height="3" rx="1" fill="#2c2c61" opacity="0.6"/>
  <rect x="156" y="90" width="34" height="3" rx="1" fill="#2c2c61" opacity="0.6"/>
  <text x="100" y="115" font-family="sans-serif" font-size="7" fill="#8a8e96" text-anchor="middle">Categorías</text>
